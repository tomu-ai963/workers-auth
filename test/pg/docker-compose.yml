# Postgres for the ./store/pg tests: a real server (many connections, real row
# locks) plus an HTTP proxy that speaks Neon's HTTP API, so the tests drive the
# same @neondatabase/serverless driver a Worker uses in production.
#
#   pnpm pg:up     start (waits until healthy)
#   pnpm pg:down   stop and delete the data
#
# Throwaway, test-only data, both ports bound to 127.0.0.1. The password is not
# in this file: `pnpm pg:up` (scripts/pg-test.mjs) generates a random one into
# test/pg/.env (gitignored, never printed) and `pnpm pg:down` deletes it. The
# HTTP proxy authenticates clients against the role's stored password, so the
# server cannot simply run with `trust`.
#
# Host ports default to 55436/55446, clear of personal-rag (55433/55444) and
# nonomono-shop (55432/54444). Windows reserves port ranges that move across
# reboots (netsh int ipv4 show excludedportrange protocol=tcp); when a default
# lands in one, start with WA_TEST_PG_PORT / WA_TEST_PG_HTTP_PORT set:
# `pnpm pg:up` checks the ports, then records them in test/pg/.env for vitest.
name: workers-auth-test

services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: workers_auth_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: workers_auth_test
      POSTGRES_PASSWORD: ${WA_TEST_PG_PASSWORD:?run pnpm pg:up}
    # Data in tmpfs: every `pg:up` starts empty, and nothing outlives `pg:down`.
    tmpfs:
      - /var/lib/postgresql/data
    # scram_iterations=1: the HTTP proxy re-authenticates every request, and at
    # the default 4096 iterations that alone cost ~300 ms per query on this
    # machine (measured; ~60 ms with 1). Fine for a throwaway, loopback-only
    # test database whose password is random per `pg:up` — which re-stores the
    # password after start, since initdb hashes it at the default.
    command: ['postgres', '-c', 'max_connections=200', '-c', 'fsync=off', '-c', 'scram_iterations=1']
    ports:
      - '127.0.0.1:${WA_TEST_PG_PORT:-55436}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d workers_auth_test']
      interval: 2s
      timeout: 3s
      retries: 30

  # Same image and digest personal-rag and nonomono-shop pin (:main moves).
  neon-http:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
    container_name: workers_auth_test_neon_http
    environment:
      PG_CONNECTION_STRING: postgres://postgres:${WA_TEST_PG_PASSWORD:?run pnpm pg:up}@db:5432/workers_auth_test
    ports:
      - '127.0.0.1:${WA_TEST_PG_HTTP_PORT:-55446}:4444'
    depends_on:
      db:
        condition: service_healthy
